[package]
name = "ghcheck"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Quick consolidated status of your personal GitHub PRs and CI"
authors = ["T.J. Greco <tgrecojr@gmail.com>"]
repository = "https://github.com/chainringlabs/ghcheck"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.9", features = ["derive"] }
comfy-table = { version = "8.0.1", features = ["custom_styling"] }
# Only UTC instants are used, so the time-zone database features stay off.
jiff = { version = "1.0.2", default-features = false, features = ["std"] }
owo-colors = "4.4.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
unicode-general-category = "1.1.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
